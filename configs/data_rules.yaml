version: "1.0"
random_state: 42

paths:
  raw_dataset: "data/raw/dataset.csv"
  quarantine_dir: "data/quarantine"
  interim_dir: "data/interim"
  processed_dir: "data/processed"

required_columns:
  - "Unnamed: 0"
  - "track_id"
  - "artists"
  - "album_name"
  - "track_name"
  - "popularity"
  - "duration_ms"
  - "explicit"
  - "danceability"
  - "energy"
  - "key"
  - "loudness"
  - "mode"
  - "speechiness"
  - "acousticness"
  - "instrumentalness"
  - "liveness"
  - "valence"
  - "tempo"
  - "time_signature"
  - "track_genre"

cleaning:
  drop_columns:
    - "Unnamed: 0"
  identity_required:
    - "track_id"
    - "artists"
    - "album_name"
    - "track_name"
  short_track_threshold_ms: 60000
  long_track_threshold_ms: 600000
  preserve_popularity_zero: true
  preserve_duration_outliers: true

identity:
  text_unicode_normalization: "NFKC"
  casefold: true
  trim: true
  collapse_whitespace: true
  remove_punctuation_exact_grouping: false
  sort_artists_exact_grouping: false
  fingerprint_hash: "sha256"
  expected_exact_recording_groups: 83881

incomplete_audio:
  required_zero_pattern:
    tempo: 0
    danceability: 0
    speechiness: 0
    valence: 0
    time_signature: 0
  exclude_from_recommenders: true
  classifier_baseline_strategy: "exclude"

validation_ranges:
  popularity:
    min: 0
    max: 100
  duration_ms:
    min: 1
  danceability:
    min: 0
    max: 1
  energy:
    min: 0
    max: 1
  key:
    min: -1
    max: 11
  loudness:
    report_extremes: true
  mode:
    allowed_values: [0, 1]
  speechiness:
    min: 0
    max: 1
  acousticness:
    min: 0
    max: 1
  instrumentalness:
    min: 0
    max: 1
  liveness:
    min: 0
    max: 1
  valence:
    min: 0
    max: 1
  tempo:
    min: 0
  time_signature:
    min: 0
    max: 5
